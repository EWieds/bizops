# Fly.io: always-on (the agents work around the clock), one machine, SQLite on a volume.
app = "bizops-CHANGE-ME"
primary_region = "iad"

[build]

[env]
  BIZOPS_HOME = "/data"

[mounts]
  source = "bizops_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/healthz"

[[vm]]
  memory = "2gb"
  cpus = 2
