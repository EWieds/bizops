# Model tiers for running agents. Change here, not in code.
tiers:
  exec: claude-opus-5-5       # CEO, CFO, auditor, approver, tournament judges
  worker: claude-sonnet-5-5   # most workers
  bulk: claude-haiku-5-5      # bulk, classification, routing

effort:
  exec: medium
  worker: medium
  bulk: low

max_output_tokens: 8000

# USD per million tokens: [input, output]
pricing:
  claude-opus-5-5: [4.00, 20.00]
  claude-sonnet-5-5: [2.00, 10.00]
  claude-haiku-5-5: [0.10, 0.50]
  dry-run: [0.0, 0.0]

approver_model: claude-opus-5-5     # LLM approver step (after rules and Jev)
search_model: claude-sonnet-5-5     # runs Anthropic's server-side web search for the web_search tool
web_search_usd_per_call: 0.01

# Dry-run model: simulated prices so the UI shows plausible cost without spending.
dry_run_simulated_pricing: [2.00, 10.00]

# How to reach Claude. auto = API key / ant profile if present, else the Claude Code login on this
# machine (claude CLI), else the scripted dry-run model. Or force: api | claude_cli | dry_run
backend: auto
cli_max_usd_per_call: 2.0      # hard stop per model call when using the claude CLI
cli_timeout_s: 600
cli_max_concurrent: 6       # claude CLI processes at once (each is a Node process; bounds memory)
