# Standing authorizations and guardrails. Set once by the owner; enforced in code.
# Agents can read the effect of these rules (refusals) but can never change them.

platform:
  monthly_cap_usd: 200        # total platform spend (model cost + payments) per month
  daily_cap_usd: 25           # total platform spend per UTC day
  hard_ceiling_usd: 1000      # no cap anywhere may be raised above this

messages:
  max_hops: 6                 # reply chain depth before the gateway refuses (anti ping-pong)
  ttl_hours: 24               # unread messages expire and never wake anyone

runs:
  max_turns: 12               # model calls per agent run
  max_tokens_per_run: 250000  # input + output tokens per agent run
  max_concurrent_runs: 4
  default_min_interval_s: 30

# Action classes -> standing authorization. 'allow' means agents act without asking.
authorizations:
  internal: allow             # messages, tasks, notes, files
  web_read: allow             # search, fetch pages
  spend: allow                # payments inside budgets, to owner-allowlisted payees only
  publish: allow              # (M4) sites, content
  email_b2b: allow            # (M4) with sender identification and opt-out

# The fixed list the system cannot do for you. Always lands in the needs-a-human queue.
hard_stops:
  legal_commitment: "Signing contracts or any legally binding commitment (incl. government bids, registrations, certifications)"
  identity_account: "Opening accounts that need identity verification (bank, payments, ads, telephony)"
  consumer_voice_sms: "Outbound AI voice calls or texts to consumers without documented consent"
  raise_cap: "Raising a cap past the owner's ceiling"
  external_transfer: "Moving money outside the platform (owner distributions, unlisted payees)"
  new_payee: "Adding a payee to the allowlist"
  connect_email: "Connecting the email account agents send from (one time)"
  connect_billing: "Connecting the umbrella Stripe account (one time)"
  billing_dispute: "Responding to a chargeback in Stripe (agents never contact a customer who disputed)"

# Per-agent per-hour rate limits by tool name. '*' is the default for unlisted tools.
rate_limits:
  "*": 120
  web_search: 60
  fetch_url: 120
  pay: 10

# Pre-screening: actions in this list go through the approver chain before running.
# The chain allows or blocks on its own. It never waits for a human.
approver:
  chain: [rules, jev, llm]    # default chain; first decisive verdict wins; 'rules' always runs first
  min_confidence: 0.7         # below this the action is blocked (logged, overridable)
  on_unavailable: block       # if no approver can give a confident verdict
  actions:                    # which actions are screened, and how
    pay: {chain: [rules, jev, llm], on_unavailable: block}
    create_offer: {chain: [rules, jev, llm], on_unavailable: block}
    send_payment_link: {chain: [rules, jev], on_unavailable: allow}
    send_email: {chain: [rules, jev], on_unavailable: allow}

money:
  per_payment_max_usd: 50          # absolute max for any single payment
  daily_payments_max_usd_per_org: 100
  cap_raise:                        # the v0 guardrail
    profitable_months_required: 2
    max_monthly_increase_pct: 25

web:
  fetch_timeout_s: 15
  max_bytes: 2000000
  max_chars_returned: 20000
  max_concurrent: 8
  cache_ttl_s: 900
  blocked_domains: []
  search_provider: auto         # auto | anthropic | brave | dry_run

# Background loops (code only, no model cost unless they wake an agent).
heartbeats:
  maintenance_every_s: 30       # how often the maintenance jobs are checked
  stall_hours: 6                # an open task untouched this long gets its assignee nudged
  escalate_after_nudges: 2      # then the delegator is told
  budget_alert_pct: 80          # org CEO + CFO are told once a day when spend passes this % of cap
  digest_hour_utc: 13           # the platform CEO sends the owner a daily digest after this hour
  daily_review_hours: 24        # managers get at least one review run per this many hours
  audit_every_s: 3600           # code-level audit checks (loops, cost anomalies, unsupported claims)
  connector_poll_s: 60          # check the mailbox and the payment provider this often
  management_review_hours: 12   # managers review their team's actual work this often (only if the team did something)

# Selling: outreach, offers and payments. Enforced in code.
sales:
  email_daily_max_per_org: 40       # cold + follow-up emails per business per day (protects sender reputation)
  email_followup_gap_days: 3        # min days between cold emails to the same lead (replies are exempt)
  email_max_cold_touches: 3         # stop after this many emails without a reply
  price_min_usd: 1
  price_max_usd: 2000               # offers above this need the owner (hard stop: raise_cap)
  revenue_holdback_days: 30         # revenue counts as cleared (allocatable) after refunds/chargebacks window
  b2b_only: true                    # outreach only to businesses, with a public source for the contact

# Capital allocation (reinvestment). Only verified profit (cleared revenue net of refunds and chargebacks,
# minus all spend) is allocatable. Waterfall: tax reserve -> operating reserve -> surplus split by two keys
# (CEO proposes, CFO approves; disagreements go to the platform CEO). Enforced in capital.py.
capital:
  tax_reserve_pct: 25             # placeholder rate; set the real one with your accountant (not tax advice)
  operating_reserve_months: 2     # each org keeps this many months of its own costs before surplus moves
  min_reinvest_self_pct: 50       # unless both keys write down a reason
  max_treasury_share_pct: 40      # no org receives more than this share of a month's treasury
  max_cap_increase_pct: 25        # an org's cap rises at most this much per month
  treasury_floor_usd: 100         # never spent
  outcome_review_days: 60         # then the keys score the decision against what actually happened

# Public pages anyone can use (no login). Model spend there is checked against the business's budget
# BEFORE each call, plus this daily ceiling per business; visitors are rate limited by real client IP.
public:
  demo_daily_max_usd: 2.0
  demo_per_ip_per_hour: 30
  demo_per_agent_per_hour: 200

# Sandbox market (only used while email or billing is not connected to a real provider).
sandbox:
  reply_delay_s: 45               # how long simulated prospects take to answer

# Venture budget: what the platform may launch on its own.
venture:
  max_new_orgs_per_month: 2
  max_on_trial: 3
  starting_cap_usd: 50
  templates: [generic, voice-agent-sales, rank-and-rent, digital-products]
  research_every_days: 3          # the venture analyst runs a research cycle on its own this often (0 = off)
  proposals_per_cycle: 3
  auto_launch: true               # the platform CEO may launch strong proposals itself, inside the limits above
  auto_launch_min_score: 3.6      # out of 5

# Quality bar: outbound work is scored against a professional rubric (0-4) before it ships, by Jev when
# TYPESAFE_API_KEY is set, else by the cheapest Claude tier. Below the bar it is sent back with feedback.
quality:
  enabled: true
  outreach_min: 3          # cold emails must be "good": specific, honest, one clear ask
  reply_min: 2.5
  page_min: 2.5
  deliverable_min: 0.35    # "done" must actually meet the task's deliverable
  min_confidence: 0.5

# Cheap, fast routing with Jev (or the cheapest Claude tier when Jev isn't configured).
routing:
  triage_heartbeats: true  # ask "is a full work session worth it now?" before a review heartbeat
  route_models: true       # simple wake-ups run on a cheaper model tier (never a more expensive one)
  min_confidence: 0.75
