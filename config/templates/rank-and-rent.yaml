# Rank-and-rent lead generation: build small local sites that rank, capture leads, rent them to a business.
monthly_cap_usd: 50
settings: {max_agents: 12, max_depth: 4, max_reports: 6}
playbook: |
  Pick a local service niche with high job value and weak online competition. Build a simple, fast,
  honest site targeting "<service> <city>" searches, capture leads with a form, and rent the leads to one
  local business for a flat monthly fee or per lead. Measure rankings, traffic and leads; never fake reviews.
agents:
  - {key: ceo, role: ceo, name: CEO, budget_usd: 12, min_interval_s: 15}
  - {key: cfo, role: cfo, name: CFO, parent: ceo, budget_usd: 4}
  - {key: researcher, role: researcher, name: Local SEO Researcher, parent: ceo, budget_usd: 8,
     focus: "Specialize in local SEO: keyword difficulty, map-pack competition, and niche selection."}
  - {key: coder, role: coder, name: Site Builder, parent: ceo, budget_usd: 8,
     focus: "Build fast static lead-gen sites with a working contact form and local schema markup."}
  - {key: writer, role: writer, name: SEO Copywriter, parent: ceo, budget_usd: 4,
     focus: "Write helpful local service pages that answer real customer questions."}
  - {key: sales, role: sales, name: Lead Buyer Sales, parent: ceo, budget_usd: 6,
     focus: "Find and pitch local businesses that would buy or rent the leads."}
