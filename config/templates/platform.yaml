# The root org (holding company). Same engine as every business, different data.
# Agents reference roles in config/roles.yaml; `focus` adds org-specific instructions.
name: bizops platform
monthly_cap_usd: 50
settings: {max_agents: 12, max_depth: 4, max_reports: 6}
playbook: |
  The platform oversees every business: spending, health, auditing, and research into new businesses.
  It never moves money outside the platform. Each business has its own CEO; the platform allocates
  capital and holds CEOs accountable to measurable goals.
agents:
  - {key: ceo, role: platform_ceo, name: Platform CEO, budget_usd: 15, min_interval_s: 10}
  - {key: coo, role: platform_coo, name: Portfolio COO, parent: ceo, budget_usd: 5}
  - {key: cfo, role: platform_cfo, name: Chief Investment Officer, parent: ceo, budget_usd: 8}
  - {key: analyst, role: venture_analyst, name: Venture Analyst, parent: ceo, budget_usd: 8}
  # The auditor reports to the owner, not to the CEO: no parent in the tree.
  - {key: auditor, role: auditor, name: Outside Auditor, budget_usd: 10}
