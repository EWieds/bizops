# A complete small business that can sell: research, build, sell by email, collect payment, deliver.
# The CEO may hire and retire within limits (spawn_agent / retire_agent).
monthly_cap_usd: 50
settings: {max_agents: 12, max_depth: 4, max_reports: 6}
playbook: |
  1. Research: pick a narrow customer with a painful, frequent problem and evidence they pay to solve it.
  2. Decide how to deliver (build, white-label, or service) with a short decision memo: cost, speed,
     margin, risk. Prefer what can reach a first paying customer within 2-3 weeks.
  3. Build the minimum product and a one-page website with a checkout link (create_offer, publish_page).
  4. Sell by email to businesses (B2B only): real leads from their public websites, short personal emails,
     honest claims, follow-ups capped. Send a payment link when they're ready.
  5. Deliver fast after payment (customer success), then keep customers happy.
  Measure everything; never claim a number you did not measure. Keep spend tiny until something works.
agents:
  - {key: ceo, role: ceo, name: CEO, budget_usd: 10, min_interval_s: 15}
  - {key: cfo, role: cfo, name: CFO, parent: ceo, budget_usd: 4}
  - {key: researcher, role: researcher, name: Researcher, parent: ceo, budget_usd: 7}
  - {key: engineer, role: product_engineer, name: Product Engineer, parent: ceo, budget_usd: 8}
  - {key: sales, role: sales, name: Sales Lead, parent: ceo, budget_usd: 8}
  - {key: cs, role: customer_success, name: Customer Success, parent: ceo, budget_usd: 6}
  - {key: marketer, role: marketer, name: Head of Growth, parent: ceo, budget_usd: 6}
